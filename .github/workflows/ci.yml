name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          TMDB_API_KEY: dummy-key-for-build
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cinehub
          JWT_SECRET: dummy-secret-for-build
